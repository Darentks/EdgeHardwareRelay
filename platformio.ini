; PlatformIO Project Configuration File for Smart Storage FYP - ESP32 Camera Relay Node
; Board: AI Thinker ESP32-CAM (OV2640 / OV7725)

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
