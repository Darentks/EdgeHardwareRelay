; PlatformIO Project Configuration File for Smart Storage FYP - ESP32 Camera Relay Node
; Board: AI Thinker ESP32-CAM (OV2640 / OV7725)
; Supports 12 Cameras (6 Shelves x 2 Angles) via USB or HTTP Push OTA

[platformio]
default_envs = cam1_usb

[env:esp32cam_base]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.flash_mode = qio
board_build.f_flash = 40000000L
board_build.partitions = min_spiffs.csv
extra_scripts = pre:http_ota_provisioner.py, post:http_ota_provisioner.py

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.3

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3

; =========================================================================
; SHELF_R1_C1 (CAM1: .201, CAM2: .202)
; =========================================================================
[env:cam1_usb]
extends = env:esp32cam_base
custom_cam_id = ESP32_R1_C1_CAM1
custom_shelf_id = SHELF_R1_C1
custom_ip_octet = 201

[env:cam1_ota]
extends = env:cam1_usb
upload_protocol = custom
custom_ota_mode = http
upload_port = 192.168.0.201

[env:cam2_usb]
extends = env:esp32cam_base
custom_cam_id = ESP32_R1_C1_CAM2
custom_shelf_id = SHELF_R1_C1
custom_ip_octet = 202

